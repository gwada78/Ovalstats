/* ── TOPBAR ── */

    DARK_MODE=!DARK_MODE;

    document.body.style.background=DARK_MODE?"#1A1A1A":"#D8D4CC";

    <div style={{background:C.card,borderBottom:`1px solid ${C.border}`,padding:"13px 18px",

  const [clubSearch,setClubSearch]=useState("");
  const [manualClub,setManualClub]=useState("");
  const [photo,setPhoto]=useState(null);

  const [newPlayer,setNewPlayer]=useState(null);

    d.nom.toLowerCase().includes(depSearch.toLowerCase())||d.code.includes(depSearch));
  const selectedDep=DEPARTEMENTS.find(d=>d.code===depCode);
  const clubsInDep=(CLUBS_PAR_DEP[depCode]||[]).sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
  const filteredClubs=clubsInDep.filter(c=>c.nom.toLowerCase().includes(clubSearch.toLowerCase()));
  const effectiveClub=clubObj||(manualClub?{nom:manualClub,niveau:"—"}:null);

    const f=e.target.files[0];if(!f)return;

  const next=()=>{
    setErr("");
    if(step===1&&(!firstName||!lastName||!email||!pass||!photo)){setErr("Tous les champs sont requis, y compris la photo.");return;}
    if(step===2&&(!depCode||!effectiveClub||!poste||!num)){setErr("Tous les champs sont requis.");return;}
    setStep(s=>s+1);
  };
  const confirm=()=>{
    const p={id:Date.now(),name,email,password:pass,poste,num:parseInt(num)||0,
      club:effectiveClub.nom,clubNiveau:effectiveClub.niveau,dep:selectedDep,
      photo,saison:mkSaison(),matches:[],validated:false,
      submittedAt:new Date().toLocaleDateString("fr-FR")};

          <Inp label="Email" value={email} onChange={setEmail} placeholder="ton@email.com"/>
          <Inp label="Mot de passe" type="password" value={pass} onChange={setPass} placeholder="Choisir un mot de passe"/>
        </>}

        {step===2&&<>
          {/* Département */}
          <div style={{marginBottom:14,position:"relative",zIndex:showDeps?40:1}}>
            <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:4,
              textTransform:"uppercase",letterSpacing:"0.07em"}}>Département</label>
            <div onClick={()=>setShowDeps(s=>!s)} style={{background:C.bg,
              border:`1.5px solid ${showDeps?C.orange:C.border}`,borderRadius:10,
              padding:"11px 13px",color:selectedDep?C.text:C.muted,fontSize:14,cursor:"pointer",
              display:"flex",justifyContent:"space-between",alignItems:"center",userSelect:"none"}}>
              <span>{selectedDep?`${selectedDep.code} — ${selectedDep.nom}`:"Sélectionner…"}</span>
              <span style={{color:C.muted,fontSize:11}}>{showDeps?"▲":"▼"}</span>
            </div>
            {showDeps&&(
              <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:C.card,
                border:`1.5px solid ${C.orange}`,borderRadius:12,boxShadow:"0 8px 32px rgba(0,0,0,0.14)",
                overflow:"hidden",zIndex:50}}>
                <div style={{padding:"10px 12px",borderBottom:`1px solid ${C.border}`}}>
                  <input autoFocus value={depSearch} onChange={e=>setDepSearch(e.target.value)}
                    placeholder="Nom ou numéro (ex: 78)…"
                    style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,
                      padding:"8px 10px",fontSize:13,outline:"none",boxSizing:"border-box",color:C.text}}/>
                </div>
                <div style={{maxHeight:200,overflowY:"auto"}}>
                  {filteredDeps.map(d=>(
                    <div key={d.code} onClick={()=>chooseDep(d)} style={{padding:"10px 14px",cursor:"pointer",
                      background:depCode===d.code?"#E8F0FF":C.card,fontSize:14,color:C.text,
                      borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:12,
                        color:C.orange,minWidth:28}}>{d.code}</span>
                      <span>{d.nom}</span>
                    </div>
                  ))}
                  {filteredDeps.length===0&&<div style={{padding:"14px",color:C.muted,fontSize:13,textAlign:"center"}}>Aucun résultat</div>}
                </div>
              </div>
            )}
          </div>

          {/* Clubs */}
          {depCode&&<div style={{marginBottom:14}}>
            <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:4,
              textTransform:"uppercase",letterSpacing:"0.07em"}}>
              Club licencié
              {clubsInDep.length>0&&<span style={{color:C.orange,marginLeft:6,fontWeight:600}}>{clubsInDep.length} clubs</span>}
            </label>
            {clubsInDep.length>0&&<>
              {clubsInDep.length>5&&<input value={clubSearch} onChange={e=>setClubSearch(e.target.value)}
                placeholder={`Filtrer parmi ${clubsInDep.length} clubs…`}
                style={{width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:10,
                  padding:"10px 13px",fontSize:13,outline:"none",boxSizing:"border-box",marginBottom:8,color:C.text}}/>}
              <div style={{border:`1.5px solid ${C.border}`,borderRadius:10,overflow:"hidden",marginBottom:10,
                maxHeight:200,overflowY:"auto"}}>
                {filteredClubs.map((c,i)=>(
                  <div key={c.nom} onClick={()=>{setClubObj(c);setManualClub("");}}
                    style={{padding:"10px 12px",cursor:"pointer",
                      background:clubObj?.nom===c.nom?C.navy:i%2===0?C.card:C.bg,
                      color:clubObj?.nom===c.nom?C.white:C.text,
                      borderBottom:i<filteredClubs.length-1?`1px solid ${C.border}`:"none",
                      display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                    <span style={{fontSize:13,fontWeight:clubObj?.nom===c.nom?600:400}}>{c.nom}</span>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <NivBadge niveau={c.niveau}/>
                      {clubObj?.nom===c.nom&&<span style={{fontSize:13}}>✓</span>}
                    </div>
                  </div>
                ))}
                {filteredClubs.length===0&&<div style={{padding:"12px",color:C.muted,fontSize:13,textAlign:"center"}}>Aucun club correspondant</div>}
              </div>
            </>}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div style={{flex:1,height:1,background:C.border}}/>
              <span style={{fontSize:11,color:C.muted,whiteSpace:"nowrap"}}>
                {clubsInDep.length>0?"Pas dans la liste ?":"Saisis ton club"}
              </span>
              <div style={{flex:1,height:1,background:C.border}}/>
            </div>
            <input value={manualClub} onChange={e=>{setManualClub(e.target.value);setClubObj(null);}}
              placeholder="Saisir le nom de ton club…"
              style={{width:"100%",background:C.bg,border:`1.5px solid ${manualClub?C.orange:C.border}`,
                borderRadius:10,padding:"11px 13px",color:C.text,fontSize:14,outline:"none",boxSizing:"border-box"}}/>
            {effectiveClub&&<div style={{marginTop:8,padding:"8px 12px",background:DARK_MODE?"#0A2A15":"#E8F7EE",borderRadius:8,
              fontSize:12,color:C.win,fontWeight:600,display:"flex",alignItems:"center",gap:8}}>
              <span>✓ {effectiveClub.nom}</span>
              {effectiveClub.niveau!=="—"&&<NivBadge niveau={effectiveClub.niveau}/>}
            </div>}
          </div>}

          {/* Poste + numéro */}
          {effectiveClub&&<>
            <div style={{marginBottom:14}}>
              <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:4,
                textTransform:"uppercase",letterSpacing:"0.07em"}}>Poste</label>
              <select value={poste} onChange={e=>setPoste(e.target.value)}
                style={{width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:10,
                  padding:"11px 13px",color:poste?C.text:C.muted,fontSize:14,outline:"none",
                  boxSizing:"border-box",appearance:"none",fontFamily:"Inter,sans-serif",
                  backgroundImage:`url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%237A8499' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E")`,
                  backgroundRepeat:"no-repeat",backgroundPosition:"right 13px center"}}>
                <option value="">Sélectionne ton poste</option>
                {POSTES.map(p=><option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <Inp label="Numéro de maillot" value={num} onChange={setNum} placeholder="Ex: 9"/>
          </>}
        </>}
        {step===3&&(
          <div style={{background:C.card,borderRadius:16,border:`1px solid ${C.border}`,overflow:"hidden"}}>
            <div style={{background:C.navy,padding:"18px 20px",display:"flex",alignItems:"center",gap:14}}>
              <div style={{width:50,height:50,borderRadius:12,overflow:"hidden",background:C.orange,
                display:"flex",alignItems:"center",justifyContent:"center"}}>
                {photo?<img src={photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
                  :<span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,color:C.white}}>#{num}</span>}
              </div>
              <div>
                <div style={{fontSize:17,fontWeight:700,color:C.white}}>{name}</div>
                <div style={{fontSize:12,color:C.orange,fontWeight:600}}>{poste}</div>
              </div>
            </div>
            <div style={{padding:"14px 18px"}}>
              {[
                ["Département", selectedDep?`${selectedDep.code} — ${selectedDep.nom}`:"—"],
                ["Club", effectiveClub?.nom||"—"],
                ["Niveau", effectiveClub?.niveau&&effectiveClub.niveau!=="—"?effectiveClub.niveau:"Non renseigné"],
                ["Email", email],
                ["N° maillot", num],
              ].map(([l,v])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                  padding:"9px 0",borderBottom:`1px solid ${C.border}`,gap:8}}>
                  <span style={{fontSize:13,color:C.muted,flexShrink:0}}>{l}</span>
                  <span style={{fontSize:13,fontWeight:600,color:C.navy,textAlign:"right"}}>{v}</span>
                </div>
              ))}
            </div>
          </div>
        )}
        {err&&<div style={{color:C.loss,fontSize:12,margin:"10px 0",background:DARK_MODE?"#2A1010":"#FFF0F0",
          padding:"8px 12px",borderRadius:8}}>{err}</div>}
        <div style={{marginTop:22}}>
          {step<3
            ?<button onClick={next} style={{width:"100%",background:C.navy,color:C.white,border:"none",
                borderRadius:12,padding:"13px 0",fontSize:15,fontWeight:700,cursor:"pointer",
                fontFamily:"'Syne',sans-serif"}}>Continuer →</button>
            :<button onClick={confirm} style={{width:"100%",background:C.orange,color:C.white,border:"none",
                borderRadius:12,padding:"13px 0",fontSize:15,fontWeight:700,cursor:"pointer",
                fontFamily:"'Syne',sans-serif"}}>Créer mon profil 🏉</button>}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   PLAYER PROFILE
/* ══════════════════════════════════════════════════════════ */
function PlayerProfile({user,onMatchClick,onLogout,onEditPhoto,onViewCompo,onSaisie}){
  const s=user.saison;
  const tot=s.plaqReussis+s.plaqRates;
  const eff=tot>0?Math.round(s.plaqReussis/tot*100):0;
  const totalMatchsSaison=18;
  const [notifs,setNotifs]=useState(()=>getUnreadNotifs(user.id));

  const closeNotifs=()=>{
    markNotifsRead(user.id);
    setNotifs([]);
  };
  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"Inter,sans-serif",paddingBottom:32}}>
      <TopBar onLogout={onLogout}>
        <button onClick={()=>{
          const w=window.open("","_blank");
          const s=user.saison;
          const tot=s.plaqReussis+s.plaqRates;
          const eff=tot>0?Math.round(s.plaqReussis/tot*100):0;
          w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
          <title>OvalStats — ${user.name}</title>
          <style>
            body{font-family:sans-serif;padding:32px;max-width:600px;margin:0 auto;color:#1B2A4A;}
            h1{font-size:24px;margin-bottom:4px;}
            .sub{color:#7A8499;font-size:14px;margin-bottom:24px;}
            .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px;}
            .card{background:#F7F5F0;border-radius:10px;padding:14px;text-align:center;}
            .val{font-size:28px;font-weight:800;color:#1B2A4A;}
            .lbl{font-size:10px;color:#7A8499;text-transform:uppercase;margin-top:4px;}
            table{width:100%;border-collapse:collapse;margin-top:16px;}
            th{background:#1B2A4A;color:white;padding:10px;text-align:left;font-size:12px;}
            td{padding:9px 10px;border-bottom:1px solid #E4E0D8;font-size:13px;}
            .win{color:#1E8A4C;} .loss{color:#D63B3B;} .draw{color:#C47D00;}
            .logo{color:#E8571A;font-size:20px;font-weight:900;margin-bottom:4px;}
          </style></head><body>
          <div class="logo">OvalStats</div>
          <h1>${user.name}</h1>
          <div class="sub">${user.poste} · #${user.num} · ${user.club} · Saison 2024–25</div>
          <div class="grid">
            <div class="card"><div class="val">${s.matchs}</div><div class="lbl">Matchs</div></div>
            <div class="card"><div class="val">${s.essais}</div><div class="lbl">Essais</div></div>
            <div class="card"><div class="val">${eff}%</div><div class="lbl">Efficacité plaq.</div></div>
            <div class="card"><div class="val">${s.plaqReussis}</div><div class="lbl">Plaq. réussis</div></div>
            <div class="card"><div class="val">${s.ballonsG}</div><div class="lbl">Ballons gagnés</div></div>
            <div class="card"><div class="val">${s.cartonsJ} / ${s.cartonsR}</div><div class="lbl">Cartons J/R</div></div>
          </div>
          <h2 style="font-size:16px;margin-bottom:12px;">Historique des matchs</h2>
          <table><tr><th>Date</th><th>Adversaire</th><th>Score</th><th>Essais</th><th>Plaq.</th></tr>
          ${user.matches.map(m=>`<tr>
            <td>${m.date}</td>
            <td>${m.adv}</td>
            <td class="${m.res==="V"?"win":m.res==="D"?"loss":"draw"}">${m.score} (${m.res})</td>
            <td>${m.essais}</td>
            <td>${m.plaqReussis}/${m.plaqReussis+m.plaqRates}</td>
          </tr>`).join("")}
          </table>
          <p style="margin-top:24px;font-size:11px;color:#7A8499;">Généré par OvalStats · ${new Date().toLocaleDateString("fr-FR")}</p>
          </body></html>`);
          w.document.close();
          setTimeout(()=>w.print(),500);
        }} style={{background:C.alt,border:`1px solid ${C.border}`,color:C.navy,
          fontSize:11,borderRadius:8,padding:"5px 10px",cursor:"pointer",fontWeight:600}}>
          📄 PDF
        </button>
        <button onClick={()=>{
          const txt=`🏉 ${user.name} · ${user.poste} · ${user.club}\nSaison 2024-25 : ${user.saison.essais} essais · ${user.saison.plaqReussis}/${user.saison.plaqReussis+user.saison.plaqRates} plaquages\nSuis tes stats sur OvalStats !\nhttps://gwada78.github.io/Ovalstats/`;
          if(navigator.share){
            navigator.share({title:"OvalStats — "+user.name, text:txt});
          } else {
            navigator.clipboard&&navigator.clipboard.writeText(txt);
            alert("Stats copiées !");
          }
        }} style={{background:C.orange,border:"none",color:C.white,
          fontSize:11,borderRadius:8,padding:"5px 10px",cursor:"pointer",fontWeight:600}}>
          📤 Partager
        </button>
      </TopBar>
      <NotifBanner notifs={notifs} onClose={closeNotifs} onViewCompo={onViewCompo} onViewMatch={()=>{markNotifsRead(user.id);setNotifs([]);if(user.matches.length>0){onMatchClick(user.matches[0]);}}}/>
      <div style={{padding:"0 16px"}}>
        <HeroNavy>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            {/* Photo sans crayon — clic direct pour changer */}
            <div onClick={onEditPhoto} style={{width:58,height:58,borderRadius:14,overflow:"hidden",
              background:C.orange,border:`2px solid ${C.orange}`,cursor:"pointer",flexShrink:0,
              display:"flex",alignItems:"center",justifyContent:"center"}}>
              {user.photo
                ?<img src={user.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
                :<span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,color:C.white}}>#{user.num||"?"}</span>}
            </div>
            <div>
              <div style={{fontSize:17,fontWeight:700,color:C.white}}>{user.name}</div>
              <div style={{fontSize:13,color:C.orange,fontWeight:600}}>{user.poste}</div>
              <div style={{fontSize:11,color:"#8899BB",marginTop:1}}>{user.club} · Saison 2024–25</div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:16}}>
            {[
              {v:`${s.matchs}/${totalMatchsSaison}`, l:"Matchs joués"},
              {v:s.essais,                           l:"Essais"},
              {v:`${tot>0?eff:0}%`,                  l:"Efficacité plaq."},
            ].map((k,i)=>(
              <div key={i} style={{background:"rgba(255,255,255,0.08)",borderRadius:10,
                padding:"10px 6px",textAlign:"center"}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:22,
                  color:C.white,lineHeight:1}}>{k.v}</div>
                <div style={{fontSize:10,color:"#8899BB",marginTop:3,
                  textTransform:"uppercase",letterSpacing:"0.06em"}}>{k.l}</div>
              </div>
            ))}
          </div>
        </HeroNavy>

        {/* Saisie si non sélectionné */}
        {(()=>{
          const compo = COMPO_PAR_CLUB[user.club]||{};
          const compoIds = Object.values(compo).map(Number);
          const hasCompo = compoIds.length > 0;
          const isInCompo = compoIds.includes(user.id);
          if(!hasCompo || isInCompo) return null;
          return(
            <div style={{margin:"0 0 12px",background:DARK_MODE?"#2A2010":"#FFF8E8",borderRadius:14,
              border:`1.5px solid ${C.draw}`,padding:"12px 16px",
              display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:22}}>📋</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:DARK_MODE?"#E8C060":"#7A5C00"}}>
                  Tu n'es pas sélectionné
                </div>
                <div style={{fontSize:11,color:DARK_MODE?"#C8A040":"#9A7C20",marginTop:2}}>
                  Tu peux aider en saisissant les stats !
                </div>
              </div>
              <button onClick={onSaisie} style={{background:C.orange,color:C.white,
                border:"none",borderRadius:10,padding:"8px 12px",fontSize:12,
                fontWeight:700,cursor:"pointer",fontFamily:"'Syne',sans-serif"}}>
                Saisir →
              </button>
            </div>
          );
        })()}

        {/* Messages du club */}
        <MessagesBlock club={user.club} currentUserId={user.id}/>

        <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
          letterSpacing:"0.1em",marginBottom:8}}>Stats saison 2024–25</div>

        {/* Essais + Ballons */}
        <StatGrid items={[
          {label:"Essais",         value:s.essais,   accent:C.win},
          {label:"Fautes",         value:s.fautes,   accent:C.draw},
          {label:"Ballons gagnés", value:s.ballonsG, accent:C.win},
          {label:"Ballons perdus", value:s.ballonsP, accent:C.loss},
        ]}/>

        {/* Transfo + Pénalités en ratio */}
        {(()=>{
          const items=[
            {label:"Transformations", r:s.transfoR, t:s.transfoR+s.transfoM},
            {label:"Pénalités",       r:s.penR,     t:s.penR+s.penM},
          ].filter(x=>x.t>0);
          if(!items.length) return null;
          return(
            <div style={{display:"grid",
              gridTemplateColumns:items.length===1?"1fr":"1fr 1fr",
              gap:10,marginBottom:16}}>
              {items.map(({label,r,t})=>{
                const pct=Math.round(r/t*100);
                return(
                  <div key={label} style={{background:C.card,borderRadius:13,
                    padding:"14px 12px",border:`1px solid ${C.border}`,textAlign:"center"}}>
                    <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,
                      fontSize:22,color:C.navy,lineHeight:1}}>{r}/{t}</div>
                    <div style={{fontSize:11,fontWeight:700,marginTop:4,
                      color:pct>=70?C.win:pct>=50?C.draw:C.loss}}>{pct}%</div>
                    <div style={{fontSize:10,color:C.muted,marginTop:2,
                      textTransform:"uppercase",letterSpacing:"0.07em"}}>{label}</div>
                  </div>
                );
              })}
            </div>
          );
        })()}

        {/* Cartons côte à côte */}
        <div style={{background:C.card,borderRadius:13,padding:"14px 16px",
          border:`1px solid ${C.border}`,marginBottom:16,
          display:"flex",justifyContent:"space-around",alignItems:"center"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:32,lineHeight:1}}>🟨</div>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,
              fontSize:24,color:C.draw,marginTop:4}}>{s.cartonsJ}</div>
            <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
              letterSpacing:"0.07em",marginTop:2}}>Carton jaune</div>
          </div>
          <div style={{width:1,height:60,background:C.border}}/>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:32,lineHeight:1}}>🟥</div>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,
              fontSize:24,color:s.cartonsR>0?C.loss:C.muted,marginTop:4}}>{s.cartonsR}</div>
            <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
              letterSpacing:"0.07em",marginTop:2}}>Carton rouge</div>
          </div>
        </div>

        <div style={{background:C.card,borderRadius:16,padding:"16px",
          border:`1px solid ${C.border}`,marginBottom:20}}>
          <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
            letterSpacing:"0.1em",marginBottom:12}}>Indicateurs</div>
          {[
            {l:"Plaquages réussis", v:s.plaqReussis, sub:`sur ${tot} tentatives`, c:C.win},
            {l:"Efficacité plaquages", v:`${eff}%`, c:C.navy},
            {l:"Essais / match", v:s.matchs>0?+(s.essais/s.matchs).toFixed(1):0, c:C.orange},
          ].map((r,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"9px 0",borderBottom:i<2?`1px solid ${C.border}`:"none"}}>
              <div>
                <div style={{fontSize:13,color:C.text}}>{r.l}</div>
                {r.sub&&<div style={{fontSize:11,color:C.muted}}>{r.sub}</div>}
              </div>
              <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,color:r.c}}>{r.v}</span>
            </div>
          ))}
        </div>

        <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
          letterSpacing:"0.1em",marginBottom:8}}>Stats par match</div>
        {user.matches.length===0
          ?<div style={{textAlign:"center",padding:"28px 20px",color:C.muted,fontSize:13,
              background:C.card,borderRadius:14,border:`1px solid ${C.border}`}}>
            <div style={{fontSize:28,marginBottom:8}}>🏉</div>
            Aucun match enregistré.<br/>
            <span style={{color:C.orange,fontWeight:600}}>Le staff saisit les stats après chaque match.</span>
          </div>
          :<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {user.matches.map(m=>(
              <div key={m.id} onClick={()=>onMatchClick(m)}
                style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,
                  padding:"13px 16px",display:"flex",alignItems:"center",
                  justifyContent:"space-between",cursor:"pointer"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor=C.orange}
                onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <ResTag res={m.res}/>
                  <div>
                    <div style={{fontSize:14,fontWeight:600,color:C.text}}>{m.adv}</div>

                <div style={{fontSize:12,color:C.muted}}>Moyenne saison</div>

                  </span>
                  {tot>0&&totS>0&&(
                    <span style={{fontSize:12,fontWeight:700,
                      color:pct>pctS?C.win:pct<pctS?C.loss:C.muted}}>

                    </span>
                  )}
                </div>
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );

const STAFF_ROLES = [
  {key:"president",   label:"Président de club",   desc:"Accès complet stats. Valide tout le staff.",           needsValidation:true, validatedBy:["admin"]},
  {key:"entraineur",  label:"Entraîneur",           desc:"Accès complet stats. Pas de saisie match.",            needsValidation:true, validatedBy:["president","admin"]},
  {key:"soigneur",    label:"Soigneur",             desc:"Saisie match + compo + effectif.",                     needsValidation:true, validatedBy:["entraineur","president","admin"]},
  {key:"preparateur", label:"Préparateur physique", desc:"Saisie match + compo + effectif.",                     needsValidation:true, validatedBy:["entraineur","president","admin"]},
  {key:"benevole",    label:"Bénévole",             desc:"Saisie match + compo + effectif.",                     needsValidation:true, validatedBy:["entraineur","president","admin"]},
  {key:"intendant",   label:"Intendant",            desc:"Saisie match + compo + effectif.",                     needsValidation:true, validatedBy:["entraineur","president","admin"]},
];

// Rôles avec accès saisie match
const CAN_SAISIE = ["soigneur","preparateur","benevole","intendant","joueur_disponible"];
// Rôles avec accès stats globales
const CAN_STATS  = ["president","entraineur"];

// Qui peut valider quoi
const canValidate = (validatorRole, targetRole) => {
  if(validatorRole==="admin") return ["president","entraineur"].includes(targetRole);
  const r = STAFF_ROLES.find(x=>x.key===targetRole);
  if(!r) return false;
  return r.validatedBy.includes(validatorRole);
};

/* ══════════════════════════════════════════════════════════
   ADMIN DASHBOARD
/* ══════════════════════════════════════════════════════════ */
function AdminDashboard({onLogout}){
  const [tick,setTick]=useState(0);
  const pending=PENDING_STAFF; // admin sees all

  const validate=(id)=>{
    const s=STAFF.find(x=>x.id===id);
    if(s) s.validated=true;
    const pi=PENDING_STAFF.findIndex(x=>x.id===id);
    if(pi>-1) PENDING_STAFF.splice(pi,1);
    setTick(t=>t+1);
  };
  const reject=(id)=>{
    const idx=STAFF.findIndex(x=>x.id===id);
    if(idx>-1) STAFF.splice(idx,1);
    const pi=PENDING_STAFF.findIndex(x=>x.id===id);
    if(pi>-1) PENDING_STAFF.splice(pi,1);
    setTick(t=>t+1);
  };

  const roleLabel={president:"Président",entraineur:"Entraîneur"};

  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"Inter,sans-serif",paddingBottom:32}}>
      <TopBar onLogout={onLogout} title="Admin OvalStats"/>
      <div style={{padding:"0 16px"}}>

        {pending.length===0?(

            border:`1px solid ${C.border}`,color:C.muted,fontSize:13,marginBottom:16}}>

        ):(
          <div style={{display:"flex",flexDirection:"column",gap:10}}>

                  <button onClick={()=>reject(p.id)} style={{flex:1,background:DARK_MODE?"#2A1010":"#FFF0F0",
                    color:C.loss,border:`1px solid ${C.loss}33`,borderRadius:10,
                    padding:"10px 0",fontSize:13,fontWeight:700,cursor:"pointer",
                    fontFamily:"'Syne',sans-serif"}}>✕ Refuser</button>
                  <button onClick={()=>validate(p.id)} style={{flex:2,background:C.win,

                </div>
              </div>
            ))}
          </div>
        )}

        {/* Logs d'activité */}
        <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",

  const validate=(id)=>{
    const s=STAFF.find(x=>x.id===id);
    if(s) s.validated=true;
    PENDING_STAFF=PENDING_STAFF.filter(x=>x.id!==id);
    setPending(p=>p.filter(x=>x.id!==id));
  };
  const reject=(id)=>{
    const idx=STAFF.findIndex(x=>x.id===id);
    if(idx>-1) STAFF.splice(idx,1);
    PENDING_STAFF=PENDING_STAFF.filter(x=>x.id!==id);
    setPending(p=>p.filter(x=>x.id!==id));
  };

  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"Inter,sans-serif",paddingBottom:32}}>
      <TopBar onLogout={onLogout}/>

        <MessagesBlock club={user.club} currentUserId={user.id}/>

        {/* Compo uniquement — pas de saisie match */}
        <button onClick={onCompo} style={{width:"100%",background:C.card,color:C.navy,
          border:`1.5px solid ${C.border}`,borderRadius:16,padding:"14px 20px",marginBottom:16,
          cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",

            ["joueurs",pendingPlayersCount>0?`👤 Joueurs (${pendingPlayersCount})`:"👤 Joueurs"],
            ["staff", pendingStaffCount>0?`📋 Staff (${pendingStaffCount})`:"📋 Staff"],
            ["scoreurs","⭐ Scoreurs"],
          ].map(([t,l])=>(
            <button key={t} onClick={()=>setMainTab(t)} style={{
              flex:1,padding:"9px 0",borderRadius:99,border:"none",cursor:"pointer",
              background:mainTab===t?C.navy:"transparent",
              color:mainTab===t?C.white:C.muted,

        {mainTab==="joueurs"&&<PlayerValidationTab club={user.club}/>}

        {mainTab==="staff"&&<>

function CompoScreen({club, onBack}){
  const squad = PLAYERS.filter(p=>p.club===club);
  const alreadySaved = COMPO_PAR_CLUB[club]&&Object.keys(COMPO_PAR_CLUB[club]).length>0;
  const [editing, setEditing] = useState(!alreadySaved);
  const [compo, setCompo] = useState(()=>{
    if(COMPO_PAR_CLUB[club]&&Object.keys(COMPO_PAR_CLUB[club]).length>0)
      return {...COMPO_PAR_CLUB[club]};
    // Compo par défaut : joueurs triés par numéro assignés aux postes 1-15
    const sorted=[...PLAYERS.filter(p=>p.club===club)].sort((a,b)=>a.num-b.num);
    const def={};
    for(let i=1;i<=23;i++){
      const p=sorted.find(pl=>pl.num===i);
      if(p) def[i]=p.id;
    }
    return def;
  });
  // Numéros de maillot modifiables pour ce match (par défaut : numéro du joueur)
  const [maillotsMatch, setMaillotsMatch] = useState(()=>{
    const m={};
    squad.forEach(p=>{m[p.id]=p.num;});
    return m;
  });
  const [saved, setSaved] = useState(false);

  const ALL_POSTES = [
    {num:1, poste:"Pilier gauche"},{num:2, poste:"Talonneur"},{num:3, poste:"Pilier droit"},
    {num:4, poste:"2e ligne G"},   {num:5, poste:"2e ligne D"},
    {num:6, poste:"3e ligne aile G"},{num:7,poste:"3e ligne aile D"},{num:8,poste:"N°8"},
    {num:9, poste:"Demi de mêlée"},{num:10,poste:"Demi d'ouverture"},
    {num:11,poste:"Ailier G"},     {num:12,poste:"Centre G"},
    {num:13,poste:"Centre D"},     {num:14,poste:"Ailier D"},  {num:15,poste:"Arrière"},
    {num:16,poste:"Remplaçant 1"}, {num:17,poste:"Remplaçant 2"},{num:18,poste:"Remplaçant 3"},
    {num:19,poste:"Remplaçant 4"}, {num:20,poste:"Remplaçant 5"},{num:21,poste:"Remplaçant 6"},
    {num:22,poste:"Remplaçant 7"}, {num:23,poste:"Remplaçant 8"},
  ];

  const saveCompo = () => {
    COMPO_PAR_CLUB[club] = {...compo};
    squad.forEach(p=>{
      if(maillotsMatch[p.id]!==undefined) p.numMatch=maillotsMatch[p.id];
    });
    const matchDate = new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
    // Message automatique à toute l'équipe
    addMessage("Staff", "entraineur", club, "📋 La composition pour le prochain match est disponible ! Consultez l'app pour voir votre place dans le 15.");
    // Notif pour TOUS les joueurs du club (pas seulement ceux dans la compo)
    PLAYERS.filter(p=>p.club===club).forEach(p=>{
      NOTIFICATIONS.push({
        id:Date.now()+p.id,
        playerId:p.id,
        type:"compo",
        matchAdv:"prochain match",
        date:matchDate,
        read:false,
      });
    });
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  };

  const titulaires = ALL_POSTES.slice(0,15);
  const remplacants = ALL_POSTES.slice(15);

  const renderPoste = ({num, poste}) => {
    const playerId = compo[num];
    const player = squad.find(p=>String(p.id)===String(playerId));
    return(
      <div key={num} style={{background:C.card,border:`1px solid ${playerId?C.border:C.border}`,
        borderRadius:12,padding:"10px 12px",display:"flex",alignItems:"center",gap:10}}>
        {/* Numéro de poste */}
        <div style={{width:32,height:32,borderRadius:8,
          background:num<=15?C.navy:C.muted,flexShrink:0,
          display:"flex",alignItems:"center",justifyContent:"center"}}>
          <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,
            fontSize:13,color:C.white}}>{num}</span>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:10,color:C.muted,marginBottom:3}}>{poste}</div>
          {player&&(
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
              <div style={{width:28,height:28,borderRadius:7,background:C.alt,overflow:"hidden",
                flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                {player.photo
                  ?<img src={player.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
                  :<span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:11,color:C.navy}}>#{player.num}</span>}
              </div>
              <span style={{fontSize:12,fontWeight:600,color:C.navy}}>#{maillotsMatch[player.id]||player.num} {player.name}</span>
            </div>
          )}
          <select value={compo[num]||""} onChange={e=>setCompo(c=>({...c,[num]:e.target.value}))}
            style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,
              borderRadius:7,padding:"6px 10px",fontSize:12,outline:"none",
              color:playerId?C.text:C.muted,appearance:"none",fontFamily:"Inter,sans-serif",
              backgroundImage:`url("data:image/svg+xml,%3Csvg width='8' height='5' viewBox='0 0 8 5' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l3 3 3-3' stroke='%237A8499' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E")`,
              backgroundRepeat:"no-repeat",backgroundPosition:"right 8px center"}}>
            <option value="">— Choisir</option>
            {squad.map(p=>(
              <option key={p.id} value={p.id}>{p.name}</option>
            ))}
          </select>
        </div>
        {/* Numéro de maillot pour ce match */}
        {player&&(
          <div style={{flexShrink:0,textAlign:"center"}}>
            <div style={{fontSize:9,color:C.muted,marginBottom:2}}>Maillot</div>
            <input
              type="number"
              value={maillotsMatch[player.id]??player.num}
              onChange={e=>setMaillotsMatch(m=>({...m,[player.id]:parseInt(e.target.value)||player.num}))}
              style={{width:44,background:C.bg,border:`1.5px solid ${C.orange}`,
                borderRadius:7,padding:"5px 4px",fontSize:13,fontWeight:700,
                color:C.navy,textAlign:"center",outline:"none",
                fontFamily:"'Syne',sans-serif"}}/>
          </div>
        )}
      </div>
    );
  };

  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"Inter,sans-serif",paddingBottom:80}}>
      <TopBar onBack={onBack} title="📋 Composition"/>
      <div style={{padding:"12px 16px"}}>
        <div style={{fontSize:12,color:C.muted,marginBottom:14,lineHeight:1.5}}>
          Assigne chaque joueur à son poste et confirme son numéro de maillot pour ce match.
        </div>

        {/* Titulaires 1-15 */}
        <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
          letterSpacing:"0.1em",marginBottom:8}}>Titulaires (1–15)</div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {titulaires.map(renderPoste)}
        </div>

        {/* Remplaçants 16-23 */}
        <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
          letterSpacing:"0.1em",marginBottom:8}}>Remplaçants (16–23)</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {remplacants.map(renderPoste)}
        </div>
      </div>

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",
        width:374,padding:"12px 16px",background:C.bg,borderTop:`1px solid ${C.border}`,zIndex:10}}>
        {editing?(
          <button onClick={saveCompo} style={{width:"100%",
            background:saved?C.win:C.orange,color:C.white,border:"none",borderRadius:14,
            padding:"14px 0",fontSize:15,fontWeight:700,cursor:"pointer",
            fontFamily:"'Syne',sans-serif",transition:"background .3s"}}>
            {saved?"✓ Composition enregistrée !":"Enregistrer la composition"}
          </button>
        ):(
          <div style={{display:"flex",gap:10}}>
            <button onClick={onBack} style={{flex:1,background:C.card,color:C.navy,
              border:`1.5px solid ${C.border}`,borderRadius:14,padding:"14px 0",
              fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"'Syne',sans-serif"}}>
              ← Retour
            </button>
            <button onClick={()=>setEditing(true)} style={{flex:2,background:C.orange,
              color:C.white,border:"none",borderRadius:14,padding:"14px 0",
              fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"'Syne',sans-serif"}}>
              ✏️ Modifier la composition
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   VALIDATION JOUEURS — composant partagé par tout le staff
/* ══════════════════════════════════════════════════════════ */
function PlayerValidationTab({club}){
  const [tick,setTick]=useState(0); // force re-render
  const pending=PENDING_PLAYERS.filter(p=>p.club===club&&!PLAYERS.find(x=>x.id===p.id&&x.validated));

  const validate=(id)=>{
    const player=PLAYERS.find(x=>x.id===id);
    if(player) player.validated=true;
    const pi=PENDING_PLAYERS.findIndex(x=>x.id===id);
    if(pi>-1) PENDING_PLAYERS.splice(pi,1);
    setTick(t=>t+1);
  };
  const reject=(id)=>{
    const idx=PLAYERS.findIndex(x=>x.id===id);

  if(pending.length===0) return(

      {pending.map(p=>(

            </div>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:C.navy}}>{p.name}</div>
              <div style={{fontSize:11,color:C.muted}}>{p.poste} · #{p.num}</div>
              <div style={{fontSize:11,color:C.orange,marginTop:1}}>
                Inscrit le {p.submittedAt}
              </div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>reject(p.id)} style={{flex:1,background:DARK_MODE?"#2A1010":"#FFF0F0",
              color:C.loss,border:`1px solid ${C.loss}33`,borderRadius:10,
              padding:"10px 0",fontSize:13,fontWeight:700,cursor:"pointer",
              fontFamily:"'Syne',sans-serif"}}>✕ Refuser</button>
            <button onClick={()=>validate(p.id)} style={{flex:2,background:C.win,

              fontFamily:"'Syne',sans-serif"}}>✓ Valider</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function getScoreur(staffId, name, club, role) {
  if(!SCOREURS[staffId]) {
    SCOREURS[staffId] = {id:staffId, name, club, role, pts:0, matchsSaisis:0,
      consecutifs:0, dernieresSaisies:[], mitempoBonus:false, finSaisonBonus:false};
  }
  return SCOREURS[staffId];
}

function calculerPoints(staffId, name, club, role, {rapide, exterieur, avecPhoto, tousLesStats, matchDate}) {
  const s = getScoreur(staffId, name, club, role);
  let pts = 50; // Match complet
  const raisons = ["⚡ Match saisi (+50 pts)"];

  if(rapide)     { pts += 10; raisons.push("🏃 Saisi en moins de 10 min (+10 pts)"); }
  if(exterieur)  { pts += 30; raisons.push("🚌 Match à l'extérieur (+30 pts)"); }
  if(avecPhoto)  { pts += 5;  raisons.push("📸 Photo jointe (+5 pts)"); }

  s.matchsSaisis += 1;
  s.consecutifs  += 1;
  s.dernieresSaisies.push(matchDate);
  s.pts += pts;

  // Bonus 5 matchs consécutifs
  if(s.consecutifs > 0 && s.consecutifs % 5 === 0) {
    s.pts += 25;
    raisons.push("🔥 5 matchs consécutifs ! (+25 pts)");
  }

  return {pts, raisons, total: s.pts};
}

function getTopScoreurs(club, limit=10) {
  return Object.values(SCOREURS)
    .filter(s=>s.club===club)
    .sort((a,b)=>b.pts-a.pts)
    .slice(0, limit);
}

                    {roleLabel[p.role]||p.role} · {p.submittedAt}
                  </div>
                  <div style={{display:"flex",gap:8,marginTop:10}}>
                    <button onClick={()=>{
                      const idx=STAFF.findIndex(x=>x.id===p.id);
                      if(idx>-1) STAFF.splice(idx,1);
                      const pi=PENDING_STAFF.findIndex(x=>x.id===p.id);
                      if(pi>-1) PENDING_STAFF.splice(pi,1);
                      setStaffTick(t=>t+1);
                    }} style={{flex:1,background:DARK_MODE?"#2A1010":"#FFF0F0",color:C.loss,
                      border:`1px solid ${C.loss}33`,borderRadius:10,padding:"9px 0",
                      fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'Syne',sans-serif"}}>
                      ✕ Refuser
                    </button>
                    <button onClick={()=>{
                      const s=STAFF.find(x=>x.id===p.id);
                      if(s) s.validated=true;
                      const pi=PENDING_STAFF.findIndex(x=>x.id===p.id);
                      if(pi>-1) PENDING_STAFF.splice(pi,1);
                      setStaffTick(t=>t+1);
                    }} style={{flex:2,background:C.win,color:C.white,border:"none",
                      borderRadius:10,padding:"9px 0",fontSize:13,fontWeight:700,
                      cursor:"pointer",fontFamily:"'Syne',sans-serif"}}>
                      ✓ Valider
                    </button>
                  </div>
                </div>
              ))}
            </div>
          );
        })()}
        {mainTab==="scoreurs"&&<TopScoreursBlock club={staff.club} full={true}/>}
        {mainTab==="equipe"&&<>
        {/* Message */}
        <MessageCompose staff={staff}/>
        <MessagesBlock club={staff.club} currentUserId={staff.id}/>

        {/* Stats globales */}
        <TeamStatsBlock club={staff.club}/>

        <div style={{display:"flex",gap:10,marginBottom:16}}>
          <button onClick={onCompo} style={{width:"100%",background:C.card,color:C.navy,
            border:`1.5px solid ${C.border}`,borderRadius:14,padding:"14px 12px",
            cursor:"pointer",fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,
            textAlign:"center"}}>
            📋 Saisir / voir la composition
          </button>
        </div>

        {/* Classement par stat */}
        <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
          letterSpacing:"0.1em",marginBottom:8}}>Classement équipe</div>

        {/* Onglets */}
        <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
          {RANK_TABS.map(t=>(
            <button key={t.k} onClick={()=>setRankTab(t.k)} style={{
              padding:"7px 14px",borderRadius:99,border:"none",cursor:"pointer",
              whiteSpace:"nowrap",fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:12,
              background:rankTab===t.k?C.navy:C.card,
              color:rankTab===t.k?C.white:C.muted,
              outline:rankTab===t.k?"none":`1px solid ${C.border}`,
              transition:"all .2s"
            }}>{t.emoji} {t.l}</button>
          ))}
        </div>

        {/* Liste classée */}
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
          {sorted.map((p,idx)=>{
            const val=getVal(p,rankTab);
            const pct=Math.min((val/max)*100,100);
            const medals=["🥇","🥈","🥉"];
            const isPlaq=rankTab==="plaqReussis";
            const totPlaq=p.saison.plaqReussis+p.saison.plaqRates;
            return(
              <div key={p.id} onClick={()=>onPlayerClick(p)}
                style={{background:C.card,border:`1px solid ${idx===0?C.orange:C.border}`,
                  borderRadius:14,padding:"12px 14px",cursor:"pointer"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor=C.orange}
                onMouseLeave={e=>e.currentTarget.style.borderColor=idx===0?C.orange:C.border}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  {/* Rang */}
                  <div style={{width:28,flexShrink:0,textAlign:"center",
                    fontSize:idx<3?18:13,
                    fontFamily:"'Syne',sans-serif",fontWeight:800,
                    color:idx<3?"inherit":C.muted}}>
                    {idx<3?medals[idx]:`${idx+1}`}
                  </div>
                  {/* Avatar */}
                  <div style={{width:36,height:36,borderRadius:9,background:C.alt,
                    overflow:"hidden",flexShrink:0,display:"flex",
                    alignItems:"center",justifyContent:"center"}}>
                    {p.photo
                      ?<img src={p.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
                      :<span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,
                        fontSize:13,color:C.navy}}>#{p.num}</span>}
                  </div>
                  {/* Infos */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div style={{minWidth:0,flex:1}}>
                        <div style={{fontSize:13,fontWeight:600,color:C.text,
                          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                        <div style={{fontSize:11,color:C.muted}}>
                          {p.poste} · {p.saison.matchs} match{p.saison.matchs>1?"s":""}
                        </div>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
                        <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,
                          fontSize:22,color:idx===0?C.orange:C.navy}}>
                          {isPlaq?`${val}%`:val}
                        </span>
                        {isPlaq&&totPlaq>0&&(
                          <div style={{fontSize:10,color:C.muted}}>
                            {p.saison.plaqReussis}/{totPlaq}
                          </div>
                        )}

                        {rankTab==="cartonsJ"&&(
                          <div style={{fontSize:10,color:C.muted}}>
                            🟥 {p.saison.cartonsR}
                          </div>
                        )}
                        {rankTab==="ballonsG"&&(
                          <div style={{fontSize:10,color:C.loss}}>
                            🔴 {p.saison.ballonsP} perdus
                          </div>
                        )}
                      </div>
                    </div>
                    {/* Barre */}
                    <div style={{height:4,background:C.alt,borderRadius:99,overflow:"hidden",marginTop:6}}>
                      <div style={{height:"100%",width:`${pct}%`,
                        background:idx===0?C.orange:C.navy,borderRadius:99}}/>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {sorted.length===0&&(
          <div style={{background:C.card,borderRadius:14,padding:"24px",textAlign:"center",
            border:`1px solid ${C.border}`,color:C.muted,fontSize:13,marginBottom:16}}>
            Aucun joueur avec des stats dans cette catégorie
          </div>
        )}
        </>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   COMPO VIEW — lecture seule pour les joueurs
══════════════════════════════════════════════════════════ */
function CompoViewPlayer({club, onBack}){
  const compo = COMPO_PAR_CLUB[club]||{};
  const squad = PLAYERS.filter(p=>p.club===club);
  const POSTES_LABELS = {
    1:"Pilier gauche",2:"Talonneur",3:"Pilier droit",
    4:"2e ligne G",5:"2e ligne D",6:"3e ligne aile G",
    7:"3e ligne aile D",8:"N°8",9:"Demi de mêlée",10:"Demi d'ouverture",
    11:"Ailier G",12:"Centre G",13:"Centre D",14:"Ailier D",15:"Arrière",
    16:"Remplaçant 1",17:"Remplaçant 2",18:"Remplaçant 3",19:"Remplaçant 4",
    20:"Remplaçant 5",21:"Remplaçant 6",22:"Remplaçant 7",23:"Remplaçant 8",
  };

  const titulaires = Array.from({length:15},(_,i)=>i+1);
  const remplacants = Array.from({length:8},(_,i)=>i+16);

  const renderLine = (num) => {
    const playerId = compo[num];
    const player = squad.find(p=>String(p.id)===String(playerId));
    return(
      <div key={num} style={{display:"flex",alignItems:"center",gap:12,
        padding:"10px 14px",borderBottom:`1px solid ${C.border}`,
        background:player?"white":"#FAFAFA"}}>
        <div style={{width:32,height:32,borderRadius:8,
          background:num<=15?C.navy:C.muted,flexShrink:0,
          display:"flex",alignItems:"center",justifyContent:"center"}}>
          <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,
            fontSize:13,color:C.white}}>{num}</span>
        </div>
        {player?(
          <>
            <div style={{width:36,height:36,borderRadius:9,background:C.alt,
              overflow:"hidden",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
              {player.photo
                ?<img src={player.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
                :<span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:13,color:C.navy}}>#{player.num}</span>}
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:600,color:C.navy}}>{player.name}</div>
              <div style={{fontSize:11,color:C.muted}}>{POSTES_LABELS[num]}</div>
            </div>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,
              fontSize:16,color:C.orange}}>#{player.numMatch||player.num}</div>
          </>
        ):(
          <div style={{fontSize:13,color:C.muted,fontStyle:"italic"}}>
            {POSTES_LABELS[num]} — Non défini
          </div>
        )}
      </div>
    );
  };

  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"Inter,sans-serif",paddingBottom:32}}>
      <TopBar onBack={onBack} title="📋 Composition"/>
      <div style={{padding:"12px 16px"}}>
        <div style={{background:C.navy,borderRadius:16,padding:"14px 18px",marginBottom:16,
          position:"relative",overflow:"hidden"}}>
          <TerrainBg opacity={0.07}/>
          <div style={{position:"relative",fontSize:10,color:"rgba(255,255,255,0.5)",
            textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Prochain match</div>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,color:C.white}}>
            {club}
          </div>
        </div>

        <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
          letterSpacing:"0.1em",marginBottom:6}}>Titulaires (1–15)</div>
        <div style={{background:C.card,borderRadius:14,overflow:"hidden",
          border:`1px solid ${C.border}`,marginBottom:14}}>
          {titulaires.map(renderLine)}
        </div>

        <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
          letterSpacing:"0.1em",marginBottom:6}}>Remplaçants (16–23)</div>
        <div style={{background:C.card,borderRadius:14,overflow:"hidden",
          border:`1px solid ${C.border}`}}>
          {remplacants.map(renderLine)}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   STATS GLOBALES ÉQUIPE — pour entraîneur et président
══════════════════════════════════════════════════════════ */
function TeamStatsBlock({club}){
  const players = PLAYERS.filter(p=>p.club===club&&p.saison.matchs>0);
  if(!players.length) return null;
  const tot = (key) => players.reduce((s,p)=>s+(p.saison[key]||0),0);
  const totalMatchs = Math.max(...players.map(p=>p.saison.matchs));
  const totalPlaqR = tot("plaqReussis");
  const totalPlaqT = tot("plaqReussis")+tot("plaqRates");
  const pctPlaq = totalPlaqT>0?Math.round(totalPlaqR/totalPlaqT*100):0;
  const essaisParMatch = totalMatchs>0?(tot("essais")/totalMatchs).toFixed(1):0;
  const ballonsPerduParMatch = totalMatchs>0?(tot("ballonsP")/totalMatchs).toFixed(1):0;
  const fautesParMatch = totalMatchs>0?(tot("fautes")/totalMatchs).toFixed(1):0;
  // Bilan V/N/D depuis les matchs
  const allMatches = players.flatMap(p=>p.matches||[]);
  const matchIds = [...new Set(allMatches.map(m=>m.adv+"_"+m.date))];
  const uniq = matchIds.map(id=>{const m=allMatches.find(x=>x.adv+"_"+x.date===id);return m;}).filter(Boolean);
  const wins=uniq.filter(m=>m.res==="V").length;
  const draws=uniq.filter(m=>m.res==="N").length;
  const losses=uniq.filter(m=>m.res==="D").length;

  return(
    <div style={{marginBottom:16}}>
      {/* Bilan saison */}
      {uniq.length>0&&(
        <div style={{background:C.navy,borderRadius:14,padding:"14px 16px",marginBottom:10,
          display:"flex",alignItems:"center",gap:0,overflow:"hidden",position:"relative"}}>
          <TerrainBg opacity={0.06}/>
          <div style={{position:"relative",flex:1,textAlign:"center"}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:28,color:C.win}}>{wins}</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.5)",textTransform:"uppercase"}}>Victoires</div>
          </div>
          <div style={{width:1,height:40,background:"rgba(255,255,255,0.1)"}}/>
          <div style={{position:"relative",flex:1,textAlign:"center"}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:28,color:C.draw}}>{draws}</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.5)",textTransform:"uppercase"}}>Nuls</div>
          </div>
          <div style={{width:1,height:40,background:"rgba(255,255,255,0.1)"}}/>
          <div style={{position:"relative",flex:1,textAlign:"center"}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:28,color:C.loss}}>{losses}</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.5)",textTransform:"uppercase"}}>Défaites</div>
          </div>
        </div>
      )}
      <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
        letterSpacing:"0.1em",marginBottom:8}}>Stats globales de l'équipe</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        {[
          {label:"% plaquages",val:pctPlaq+"%",sub:totalPlaqR+"/"+totalPlaqT,color:pctPlaq>=75?C.win:pctPlaq>=50?"#C47D00":C.loss},
          {label:"Essais / match",val:essaisParMatch,sub:`${tot("essais")} total`,color:C.win},
          {label:"Ballons perdus",val:ballonsPerduParMatch,sub:"par match",color:C.loss},
          {label:"Pénalités / match",val:fautesParMatch,sub:`${tot("fautes")} total`,color:"#C0392B"},
        ].map((s,i)=>(
          <div key={i} style={{background:C.card,borderRadius:12,padding:"12px",
            border:`1px solid ${C.border}`,textAlign:"center"}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,
              fontSize:22,color:s.color,lineHeight:1}}>{s.val}</div>
            <div style={{fontSize:10,color:C.muted,marginTop:4}}>{s.label}</div>
            <div style={{fontSize:10,color:C.muted,opacity:0.7}}>{s.sub}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TopScoreursBlock({club, full=false}){
  const top = getTopScoreurs(club, full?10:3);
  if(!top.length) return(
    <div style={{background:C.card,borderRadius:14,padding:"28px",textAlign:"center",
      border:`1px solid ${C.border}`,color:C.muted,fontSize:13}}>
      <div style={{fontSize:28,marginBottom:8}}>⭐</div>
      Aucun match saisi pour le moment
    </div>
  );
  const medals = ["🥇","🥈","🥉"];
  const roleLabel = {soigneur:"Soigneur",preparateur:"Prépa physique",
    benevole:"Bénévole",intendant:"Intendant",joueur_disponible:"Joueur disponible"};
  return(
    <div style={{marginBottom:16}}>
      <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",
        letterSpacing:"0.1em",marginBottom:8}}>🏆 Top Scoreurs</div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {top.map((s,idx)=>(
          <div key={s.id} style={{background:C.card,border:`1px solid ${idx===0?C.orange:C.border}`,
            borderRadius:12,padding:"11px 14px",display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:28,textAlign:"center",fontSize:idx<3?18:13,
              fontFamily:"'Syne',sans-serif",fontWeight:800,color:C.muted}}>
              {idx<3?medals[idx]:`${idx+1}`}
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:C.navy}}>{s.name}</div>
              <div style={{fontSize:11,color:C.muted}}>{roleLabel[s.role]||s.role} · {s.matchsSaisis} match{s.matchsSaisis>1?"s":""}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,
                fontSize:20,color:idx===0?C.orange:C.navy}}>{s.pts}</div>
              <div style={{fontSize:10,color:C.muted}}>pts</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
