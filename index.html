  if(validatorRole==="admin") return ["president","entraineur"].includes(targetRole);

  if(!r) return false;

};

function PlayerValidationTab({club}){
  const [tick,setTick]=useState(0); // force re-render
  const pending=PENDING_PLAYERS.filter(p=>p.club===club&&!PLAYERS.find(x=>x.id===p.id&&x.validated));

  const validate=(id)=>{
    const player=PLAYERS.find(x=>x.id===id);
    if(player) player.validated=true;
    const pi=PENDING_PLAYERS.findIndex(x=>x.id===id);
    if(pi>-1) PENDING_PLAYERS.splice(pi,1);
    setTick(t=>t+1);
  };
  const reject=(id)=>{
    const idx=PLAYERS.findIndex(x=>x.id===id);
    if(idx>-1) PLAYERS.splice(idx,1);
    const pi=PENDING_PLAYERS.findIndex(x=>x.id===id);
    if(pi>-1) PENDING_PLAYERS.splice(pi,1);
    setTick(t=>t+1);
  };

  if(pending.length===0) return(
    React.createElement('div', { style: {textAlign:"center",padding:"32px 20px",color:C.muted,fontSize:13,
      background:C.card,borderRadius:14,border:`1px solid ${C.border}`},}
      , React.createElement('div', { style: {fontSize:32,marginBottom:8},}, "✅"), "Aucun joueur en attente de validation"

    )
  );

  return(
    React.createElement('div', { style: {display:"flex",flexDirection:"column",gap:10},}
      , pending.map(p=>(
        React.createElement('div', { key: p.id, style: {background:C.card,border:`1.5px solid ${C.orange}44`,
          borderRadius:14,padding:"14px 16px"},}
          , React.createElement('div', { style: {display:"flex",alignItems:"center",gap:12,marginBottom:10},}
            , React.createElement('div', { style: {width:44,height:44,borderRadius:11,overflow:"hidden",
              background:C.alt,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"},}
              , p.photo
                ?React.createElement('img', { src: p.photo, style: {width:"100%",height:"100%",objectFit:"cover"}, alt: "",})
                :React.createElement('span', { style: {fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:16,color:C.navy},}, "#", p.num)
            )

function getScoreur(staffId, name, club, role) {
  if(!SCOREURS[staffId]) {
    SCOREURS[staffId] = {id:staffId, name, club, role, pts:0, matchsSaisis:0,
      consecutifs:0, dernieresSaisies:[], mitempoBonus:false, finSaisonBonus:false};
  }
  return SCOREURS[staffId];
}

function calculerPoints(staffId, name, club, role, {rapide, exterieur, avecPhoto, tousLesStats, matchDate}) {
  const s = getScoreur(staffId, name, club, role);
  let pts = 50; // Match complet
  const raisons = ["⚡ Match saisi (+50 pts)"];

  if(rapide)     { pts += 10; raisons.push("🏃 Saisi en moins de 10 min (+10 pts)"); }
  if(exterieur)  { pts += 30; raisons.push("🚌 Match à l'extérieur (+30 pts)"); }
  if(avecPhoto)  { pts += 5;  raisons.push("📸 Photo jointe (+5 pts)"); }

  s.matchsSaisis += 1;
  s.consecutifs  += 1;
  s.dernieresSaisies.push(matchDate);
  s.pts += pts;

  // Bonus 5 matchs consécutifs
  if(s.consecutifs > 0 && s.consecutifs % 5 === 0) {
    s.pts += 25;
    raisons.push("🔥 5 matchs consécutifs ! (+25 pts)");
  }

  return {pts, raisons, total: s.pts};
}

function getTopScoreurs(club, limit=10) {
  return Object.values(SCOREURS)
    .filter(s=>s.club===club)
    .sort((a,b)=>b.pts-a.pts)
    .slice(0, limit);
}

══════════════════════════════════════════════════════════ */
function TeamStatsBlock({club}){
  const players = PLAYERS.filter(p=>p.club===club&&p.saison.matchs>0);
  if(!players.length) return null;
  const tot = (key) => players.reduce((s,p)=>s+(p.saison[key]||0),0);
  const totalMatchs = Math.max.apply(null, players.map(p=>p.saison.matchs));
  const totalPlaqR = tot("plaqReussis");
  const totalPlaqT = tot("plaqReussis")+tot("plaqRates");
  const pctPlaq = totalPlaqT>0?Math.round(totalPlaqR/totalPlaqT*100):0;
  const essaisParMatch = totalMatchs>0?(tot("essais")/totalMatchs).toFixed(1):0;
  const ballonsPerduParMatch = totalMatchs>0?(tot("ballonsP")/totalMatchs).toFixed(1):0;
  const fautesParMatch = totalMatchs>0?(tot("fautes")/totalMatchs).toFixed(1):0;
  const totalEssais = tot("essais");
  const totalFautes = tot("fautes");
  const stats = [
    {label:"% plaquages",   val:pctPlaq+"%",          sub:totalPlaqR+"/"+totalPlaqT, color:pctPlaq>=75?C.win:pctPlaq>=50?"#C47D00":C.loss},
    {label:"Essais / match",val:essaisParMatch,        sub:totalEssais+" total",       color:C.win},
    {label:"Ballons perdus",val:ballonsPerduParMatch,  sub:"par match",               color:C.loss},
    {label:"Pén. / match",  val:fautesParMatch,        sub:totalFautes+" total",       color:"#C0392B"},
  ];
  return(
    React.createElement('div', { style: {marginBottom:16},}
      , React.createElement('div', { style: {fontSize:10,color:C.muted,textTransform:"uppercase",
        letterSpacing:"0.1em",marginBottom:8},}, "Stats globales de l'équipe"   )
      , React.createElement('div', { style: {display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8},}
        , stats.map((s,i)=>(
          React.createElement('div', { key: i, style: {background:C.card,borderRadius:12,padding:"12px",
            border:"1px solid "+C.border,textAlign:"center"},}
            , React.createElement('div', { style: {fontFamily:"'Syne',sans-serif",fontWeight:800,
              fontSize:22,color:s.color,lineHeight:1},}, s.val)
            , React.createElement('div', { style: {fontSize:10,color:C.muted,marginTop:4},}, s.label)
            , React.createElement('div', { style: {fontSize:10,color:C.muted,opacity:0.7},}, s.sub)
          )
        ))
      )
    )
  );
}

        style:{background:showForm?C.alt:C.orange,color:showForm?C.muted:C.white,border:"none",borderRadius:99,
          padding:"7px 13px",fontSize:11,fontWeight:800,cursor:"pointer",fontFamily:"'Syne',sans-serif"} },
        showForm?"Fermer":"+ Publier")
    ),

    showForm && React.createElement('div', { style:{background:C.card,border:"1.5px solid "+C.orange+"55",borderRadius:14,
      padding:"14px",marginBottom:14} },
      React.createElement('div', { style:{fontSize:12,fontWeight:800,color:C.text,marginBottom:10,fontFamily:"'Syne',sans-serif"} },
        "Nouvel événement de la semaine"),
      React.createElement('div', { style:{display:"flex",gap:6,marginBottom:10} },
        [["entrainement","💪 Entraînement"],["match","🏉 Match"]].map(function(t){
          var sel=fType===t[0];
          return React.createElement('button', { key:t[0], onClick:function(){setFType(t[0]);},
            style:{flex:1,padding:"8px 0",borderRadius:9,fontSize:12,fontWeight:700,cursor:"pointer",
              border:"1.5px solid "+(sel?C.orange:C.border),background:sel?C.orangeLight:C.bg,
              color:sel?C.orange:C.muted} }, t[1]);
        })
      ),
      React.createElement('input', { value:fTitre, onChange:function(e){setFTitre(e.target.value);},
        placeholder:fType==="match"?"Match vs …":"Entraînement",
        style:{width:"100%",background:C.bg,border:"1.5px solid "+C.border,borderRadius:9,
          padding:"10px 12px",fontSize:13,outline:"none",marginBottom:8,color:C.text} }),
      React.createElement('div', { style:{display:"flex",gap:8,marginBottom:8} },
        React.createElement('select', { value:fJour, onChange:function(e){setFJour(e.target.value);},
          style:{flex:1,background:C.bg,border:"1.5px solid "+C.border,borderRadius:9,padding:"10px 8px",
            fontSize:13,outline:"none",color:C.text} },
          JOURS.map(function(j){return React.createElement('option', {key:j,value:j}, j);})),
        React.createElement('input', { value:fHeure, onChange:function(e){setFHeure(e.target.value);},
          placeholder:"19h30", style:{width:90,background:C.bg,border:"1.5px solid "+C.border,borderRadius:9,
            padding:"10px 10px",fontSize:13,outline:"none",color:C.text} })
      ),
      React.createElement('input', { value:fLieu, onChange:function(e){setFLieu(e.target.value);},
        placeholder:"Lieu (Stade municipal, Extérieur…)",
        style:{width:"100%",background:C.bg,border:"1.5px solid "+C.border,borderRadius:9,
          padding:"10px 12px",fontSize:13,outline:"none",marginBottom:10,color:C.text} }),
      React.createElement('div', { style:{fontSize:10.5,color:C.muted,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.07em"} }, "Équipes concernées"),
      React.createElement('div', { style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12} },
        CATEGORIES.map(function(cat){
          var sel=fCats.indexOf(cat)!==-1;
          return React.createElement('button', { key:cat, onClick:function(){toggleCat(cat);},
            style:{padding:"6px 12px",borderRadius:99,fontSize:11.5,fontWeight:700,cursor:"pointer",
              border:"1.5px solid "+(sel?C.navy:C.border),background:sel?C.navy:C.bg,
              color:sel?C.white:C.muted} }, cat);
        })
      ),
      React.createElement('button', { onClick:publish,
        style:{width:"100%",background:C.orange,color:C.white,border:"none",borderRadius:10,
          padding:"12px 0",fontSize:13.5,fontWeight:800,cursor:"pointer",fontFamily:"'Syne',sans-serif"} },
        "Publier — les joueurs seront notifiés")
    ),

    events.length===0 && React.createElement('div', { style:{textAlign:"center",color:C.muted,fontSize:12.5,padding:"22px 0"} },
      "Aucun événement pour cette équipe cette semaine."),

    events.map(function(ev){
      var concerned = squad.filter(function(p){return ev.categories.indexOf(p.categorie)!==-1;});
      var pres=[],abs=[],inc=[],nr=[];
      concerned.forEach(function(p){
        var d=getDispo(ev.id,p.id);
        if(d==="present")pres.push(p); else if(d==="absent")abs.push(p);
        else if(d==="incertain")inc.push(p); else nr.push(p);
      });
      var open = openId===ev.id;
      return React.createElement('div', { key:ev.id, style:{background:C.card,border:"1px solid "+C.border,
        borderRadius:14,padding:"13px 14px",marginBottom:9} },
        React.createElement('div', { onClick:function(){setOpenId(open?null:ev.id);}, style:{cursor:"pointer"} },
          React.createElement('div', { style:{display:"flex",alignItems:"center",gap:9,marginBottom:8} },
            React.createElement('span', { style:{fontSize:17} }, ev.type==="match"?"🏉":"💪"),
            React.createElement('div', { style:{flex:1} },
              React.createElement('div', { style:{fontSize:13.5,fontWeight:700,color:C.text} }, ev.titre),
              React.createElement('div', { style:{fontSize:11,color:C.muted} },
                ev.jour+" · "+ev.heure+" · "+ev.lieu+" · "+ev.categories.join(" + "))
            ),
            React.createElement('span', { style:{fontSize:11,color:C.muted} }, open?"▲":"▼")
          ),
          React.createElement('div', { style:{display:"flex",gap:6} },
            [["✅",pres.length,C.win],["🤔",inc.length,C.draw],["❌",abs.length,C.loss],["⏳",nr.length,C.muted]].map(function(s,i){
              return React.createElement('span', { key:i, style:{flex:1,textAlign:"center",background:C.bg,
                borderRadius:8,padding:"6px 0",fontSize:12,fontWeight:800,color:s[2]} }, s[0]+" "+s[1]);
            })
          )
        ),
        open && React.createElement('div', { style:{marginTop:11,borderTop:"1px solid "+C.border,paddingTop:10} },
          [["Présents",pres,C.win],["Incertains",inc,C.draw],["Absents",abs,C.loss],["Sans réponse ⏳",nr,C.muted]].map(function(g){
            if(g[1].length===0) return null;
            return React.createElement('div', { key:g[0], style:{marginBottom:8} },
              React.createElement('div', { style:{fontSize:10.5,fontWeight:800,color:g[2],textTransform:"uppercase",
                letterSpacing:"0.06em",marginBottom:3} }, g[0]+" ("+g[1].length+")"),
              React.createElement('div', { style:{fontSize:12,color:C.text,lineHeight:1.65} },
                g[1].map(function(p){return p.name;}).join(", "))
            );
          })
        )
      );
    })
  );
}

function App(){
  const [screen,setScreen]=useState("splash");
  const [role,setRole]=useState(null);
  const [user,setUser]=useState(null);
  const [match,setMatch]=useState(null);
  const [player,setPlayer]=useState(null);
  const [showLogoutConfirm,setShowLogoutConfirm]=useState(false);
  const [showTimeoutWarning,setShowTimeoutWarning]=useState(false);
  const photoRef=useRef();
  const timeoutRef=useRef(null);
  const warningRef=useRef(null);
  const SESSION_TIMEOUT = 10*60*1000; // 10 min
  const WARNING_BEFORE  = 60*1000;    // avertir 1 min avant

  const resetTimer=()=>{
    if(!user) return;
    clearTimeout(timeoutRef.current);
    clearTimeout(warningRef.current);
    setShowTimeoutWarning(false);
    warningRef.current=setTimeout(()=>setShowTimeoutWarning(true), SESSION_TIMEOUT-WARNING_BEFORE);
    // Pas de déconnexion auto — juste l'avertissement pour ne pas perdre les stats
  };

  useEffect(()=>{
    if(!user) return;
    const events=["click","touchstart","keydown","scroll"];
    events.forEach(e=>window.addEventListener(e,resetTimer,{passive:true}));
    resetTimer();
    return()=>{
      events.forEach(e=>window.removeEventListener(e,resetTimer));
      clearTimeout(timeoutRef.current);
      clearTimeout(warningRef.current);
    };
  },[user]);

  const login=(r,u)=>{
    setRole(r);setUser(u);
    if(u) addLog(u.name||u.email, r, "Connexion");
    if(r==="joueur")          setScreen("profile");
    else if(r==="admin")      setScreen("admin-dash");
    else if(r==="president")  setScreen("president-dash");
    else if(r==="entraineur") setScreen("staff-dash");
    else if(CAN_SAISIE.includes(r)) setScreen("benevole-dash");
  };
  const logout=(auto=false)=>{
    clearTimeout(timeoutRef.current);
    clearTimeout(warningRef.current);
    setShowLogoutConfirm(false);
    setShowTimeoutWarning(false);
    setRole(null);setUser(null);setScreen("login");
    if(auto) console.log("Session expirée");
  };
  const askLogout=()=>setShowLogoutConfirm(true);

  // Splash screen auto-dismiss
  useEffect(()=>{
    if(screen==="splash"){
      const t=setTimeout(()=>setScreen("login"),1800);
      return()=>clearTimeout(t);
    }
  },[screen]);

  const backFromSaisie=()=>{
    if(role==="president")       setScreen("president-dash");
    else if(CAN_SAISIE.includes(role)) setScreen("benevole-dash");
    else setScreen("staff-dash");
  };
  const backFromPlayer=()=>{
    if(role==="president") setScreen("president-dash");
    else setScreen("staff-dash");
  };

  const handlePhotoChange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      const p=PLAYERS.find(x=>x.id===user.id);
      if(p){p.photo=ev.target.result;setUser({...user,photo:ev.target.result});}
    };
    r.readAsDataURL(f);
  };

  return(
    React.createElement('div', { style: {position:"fixed",top:0,left:0,right:0,bottom:0,background:"#0D0A06",overflowY:"auto",overflowX:"hidden"},}
      /* styles in head */

      , React.createElement('input', { ref: photoRef, type: "file", accept: "image/*",
        onChange: handlePhotoChange, style: {display:"none"},})

      /* Modale confirmation déconnexion */
      , showLogoutConfirm&&(
        React.createElement('div', { style: {position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.6)",
          display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:24},}
          , React.createElement('div', { style: {background:C.bg,borderRadius:24,padding:"28px 24px",
            width:"100%",maxWidth:320,textAlign:"center"},}
            , React.createElement('div', { style: {fontSize:32,marginBottom:12},}, "🚪")
            , React.createElement('div', { style: {fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,
              color:C.navy,marginBottom:8},}, "Se déconnecter ?"  )
            , React.createElement('div', { style: {fontSize:13,color:C.muted,marginBottom:24,lineHeight:1.6},}, "Tu devras te reconnecter pour accéder à l'app."

            )
            , React.createElement('div', { style: {display:"flex",gap:10},}
              , React.createElement('button', { onClick: ()=>setShowLogoutConfirm(false),
                style: {flex:1,background:C.card,color:C.navy,border:`1.5px solid ${C.border}`,
                  borderRadius:12,padding:"13px 0",fontSize:14,fontWeight:700,cursor:"pointer",
                  fontFamily:"'Syne',sans-serif"},}, "Annuler"

              )
              , React.createElement('button', { onClick: ()=>logout(false),
                style: {flex:1,background:C.loss,color:C.white,border:"none",
                  borderRadius:12,padding:"13px 0",fontSize:14,fontWeight:700,cursor:"pointer",
                  fontFamily:"'Syne',sans-serif"},}, "Déconnexion"

              )
            )
          )
        )
      )

      /* Avertissement timeout */
      , showTimeoutWarning&&(
        React.createElement('div', { style: {position:"fixed",bottom:90,left:"5%",right:"5%",
          width:"90%",maxWidth:"340px",background:C.navy,borderRadius:16,padding:"14px 18px",
          zIndex:998,display:"flex",alignItems:"center",gap:12,
          boxShadow:"0 8px 32px rgba(0,0,0,0.3)"},}
          , React.createElement('span', { style: {fontSize:22},}, "⏱")
          , React.createElement('div', { style: {flex:1},}
            , React.createElement('div', { style: {fontSize:13,fontWeight:700,color:C.white},}, "Session expire dans 1 min"

            )
            , React.createElement('div', { style: {fontSize:11,color:"rgba(255,255,255,0.6)"},}, "Touche l'écran pour rester connecté"

            )
          )
          , React.createElement('button', { onClick: resetTimer, style: {background:C.orange,color:C.white,
            border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,
            fontWeight:700,cursor:"pointer"},}, "Rester"

          )
        )
      )

      , React.createElement('div', { style: {width:"100%",minHeight:"100%",background:"#0D0A06",
        overflow:"hidden",position:"relative"},}

        , screen==="splash"&&(
          React.createElement('div', { style: {minHeight:"100vh",
            background:"radial-gradient(ellipse at 50% 40%, #3D2810 0%, #0D0A06 80%)",
            display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"},}
            , React.createElement('div', { className: "stars" })
            , React.createElement('div', { style: {position:"relative",textAlign:"center",animation:"fadeIn 0.5s ease"},}
              , React.createElement('div', { style: {width:90,height:90,background:C.orange,
                borderRadius:22,display:"flex",alignItems:"center",justifyContent:"center",
                margin:"0 auto 20px",boxShadow:"0 0 50px rgba(200,150,64,0.45)"},}
                , React.createElement(Logo, { size: 1.3, light: true,})
              )
              , React.createElement('div', { style: {fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:22,
                color:"#F0E0C0",letterSpacing:1,whiteSpace:"nowrap"},}, "OVAL"
                , React.createElement('span', { style: {color:"#C89640"},}, "STATS")
              )
              , React.createElement('div', { style: {fontSize:10,color:"rgba(200,150,64,0.6)",marginTop:6,
                letterSpacing:3,textTransform:"uppercase"},}, "Performance Rugby"

              )
            )

          )
        )
        , screen==="login"          &&React.createElement(LoginScreen, { onLogin: login,
          onRegister: ()=>setScreen("register"),
          onStaffRegister: ()=>setScreen("staff-register"),})
        , screen==="register"       &&React.createElement(RegisterScreen, { onBack: ()=>setScreen("login"), onDone: u=>login("joueur",u),})
        , screen==="staff-register" &&React.createElement(StaffRegisterScreen, { onBack: ()=>setScreen("login"), onDone: ()=>setScreen("login"),})

        , screen==="profile"        &&React.createElement(PlayerProfile, { user: user, onLogout: askLogout,
          onMatchClick: m=>{setMatch(m);setScreen("match-detail");},
          onEditPhoto: ()=>photoRef.current.click(),
          onViewCompo: ()=>setScreen("compo-view"),
          onViewPlanning: ()=>setScreen("planning-view"),
          onSaisie: ()=>{setRole("joueur_disponible");setScreen("saisie");},})
        , screen==="compo-view"     &&React.createElement(CompoViewPlayer, { club: user&&user.club, onBack: ()=>setScreen("profile"),})
        , screen==="planning-view"  &&React.createElement('div', { style:{minHeight:"100vh",background:C.bg,fontFamily:"Inter,sans-serif",paddingBottom:32} },
            React.createElement(TopBar, { onBack: ()=>setScreen("profile"), title: "Mon planning",}),
            React.createElement('div', { style:{padding:"16px"} },
              React.createElement(PlanningBlock, { player: user, mode: "full",})))
        , screen==="match-detail"   &&React.createElement(MatchDetail, { match: match, user: user, onBack: ()=>setScreen("profile"),})

        , screen==="admin-dash"     &&React.createElement(AdminDashboard, { onLogout: askLogout,})

        , screen==="president-dash" &&React.createElement(PresidentDashboard, { user: user, onLogout: askLogout,
          onCompo: ()=>setScreen("compo"),
          onPlayerClick: p=>{setPlayer(p);setScreen("staff-player");},})

        , screen==="staff-dash"     &&React.createElement(StaffDashboard, { staff: user, onLogout: askLogout,
          onSaisie: ()=>setScreen("saisie"),
          onCompo: ()=>setScreen("compo"),
          onPlayerClick: p=>{setPlayer(p);setScreen("staff-player");},})

        , screen==="benevole-dash"  &&React.createElement(BenevoleDashboard, { user: user, onLogout: askLogout,
          onSaisie: ()=>setScreen("saisie"),
          onCompo: ()=>setScreen("compo"),})

        , screen==="compo"          &&React.createElement(CompoScreen, { club: user&&user.club,
          onBack: ()=>{
            if(role==="president")       setScreen("president-dash");
            else if(CAN_SAISIE.includes(role)) setScreen("benevole-dash");
            else setScreen("staff-dash");
          },})

        , screen==="saisie"         &&React.createElement(SaisieLive, { staff: user, onBack: backFromSaisie,})
        , screen==="staff-player"   &&React.createElement(StaffPlayerView, { player: player, onBack: backFromPlayer,})
      )
    )
  );
}

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
